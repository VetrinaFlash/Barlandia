# Configurazione Cloudflare Pages per l'app web di Barlandia.
# Build: npm run pages:build  →  deploy: wrangler pages deploy

name = "barlandia"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".vercel/output/static"

[[d1_databases]]
binding = "DB"
database_name = "barlandia"
database_id = "e70433dd-ac81-4cc7-897b-fcc51b37cb20"  # stesso database del worker realtime
migrations_dir = "../../migrations"

[vars]
# URL del worker realtime a cui il client apre il WebSocket
# (in locale: ws://localhost:8788 — vedi .dev.vars.example)
REALTIME_WS_URL = "wss://barlandia-realtime.SOSTITUIRE.workers.dev"

# Secret (NON in vars in produzione):
#   wrangler pages secret put SESSION_SECRET
# Deve essere IDENTICO a quello del worker realtime.
